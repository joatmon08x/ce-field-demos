schema: spec-driven

context: |
  Ledgerly is a fictional Fieldnote billing-ops app. Operator Avery Quinn. No auth. No real companies.
  Catalog only: Starter $49 (4900 cents), Growth $99 (9900 cents), Scale $249 (24900 cents) from lib/plans.ts. Format with formatUsd. Never invent a fourth price, ARR, usage overage, or enterprise tier.
  Customers only from prisma/seed.ts and prisma/extra-accounts.ts. Emails use .example.
  Demo clock is 2026-08-23. Dev server is port 43173.
  Dispute dsp_1043 may claim $400 against a $249 Scale invoice — valid input. Stored credit on accept MUST be $249 (24900 cents). Do not "correct" the claim or the seed.
  Do not migrate lib/disputes/suggested-credit-api.ts from v1 to v2 unless the change says so. Preserve both suggested-credit routes. Do not edit tests/suggested-credit-api.test.ts to get green.
  npm test on a clean tree is 1 failed / 29 passed. Do not add a red suite to the default run.
  Apply of change resolve-dispute: parent agent does not implement. Dispatch exactly three parallel workers from tasks.md; each worker prompt is the matching delta spec plus design.md shared contract. End-to-end tests are sequential after helper → API → UI apply.

rules:
  proposal:
    - Include a Non-goals section. Name suggested-credit v1, the seed, and catalog prices as out of scope unless the change is explicitly that migration.
    - Name capabilities so each parallel worker maps to one specs/<capability>/spec.md file.
  specs:
    - Use Given/When/Then scenarios. Amounts come from lib/plans.ts. dsp_1043 accept stores 24900 cents, not 40000.
    - One capability folder per isolated implementer when the change is meant for /multitask.
  tasks:
    - Group 1–3 MUST be file-disjoint parallel workers. Group 4+ is sequential (e2e, reviewer, verifier).
    - Do not assign test-file authoring to a parallel worker.
    - Each parallel task MUST cite its delta spec path.

operations:
  apply:
    guidance:
      - Prefer /multitask against .cursor/plans/resolve-dispute.md so each worker receives one OpenSpec delta spec.
      - Do not implement in the parent chat. Mid-run 501 from the resolve route is expected until the helper worker is applied.
      - After the three diffs land, apply helper → API → UI, then sequential e2e out of npm test.
      - ledgerly-reviewer on the combined diff, then dispute-verifier on port 43173. Human merges. Do not archive unless asked.
  archive:
    guidance:
      - Do not archive until Accept/Decline persist on dsp_1043 and the sequential e2e has been run. Human still merges.
